name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          UI_SCREENSHOT_DIR: ui-smoke-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-smoke-screenshots
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
